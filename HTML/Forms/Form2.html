<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
  </head>
  <body>
    <form>
       <fieldset>
        <legend>Personal Details</legend>
          Name :      <input type="text" name="name" minlength="3" maxlength="15">     <br><br>
          Age :       <input type="number" name="age">    <br><br>
          Email:      <input type="email" name="email">   <br><br>
       </fieldset> <br><br>

        <fieldset>
          <legend>Contact</legend>
          Mobile :    <input type="tel" name="mobile">    <br><br>
          Password :  <input type="password">             <br><br>
          DOB:        <input type="date" name="dob">      <br><br>
        </fieldset> <br><br>
        
        <fieldset>
          <legend>Document</legend>
          Month:      <input type="month" name="month">   <br><br>
          Resume:     <input type="file" name="resume">   <br><br>
          Volume :    <input type="range" name="Volume">  <br><br>
        </fieldset> <br><br>

        <fieldset>
          Week:       <input type="week" name="week">     <br><br>
          Color:      <input type="color" name="color">   <br><br>
          Gender:     
          <input type="radio" name="gender"> Male
          <input type="radio" name="gender">Female        <br><br>
        </fieldset> <br><br>
        <fieldset>
          Language:
          <input type="checkbox" name="lang">Hindi
          <input type="checkbox" name="lang">English      <br><br>
        </fieldset>
        

        <input type="submit">
    </form>
  </body>
</html>

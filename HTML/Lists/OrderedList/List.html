<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
  </head>
  <body>
    <h1>Ordered List</h1>   
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
        <li>BOOTSTRAP</li>
    </ol>
    <hr>
    <!--Ordered list with type and start(starting in D alphabate by 4) attribute/property-->
    <ol type="A" start="4">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
        <li>BOOTSTRAP</li>
    </ol>
    <hr>
    <!--Ordered list with type(a) attribute/>property-->
    <ol type="a" >
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
        <li>BOOTSTRAP</li>
    </ol>
    <hr>
    <!--Ordered list with type(I) attribute/>property-->
     <ol type="I">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
        <li>BOOTSTRAP</li>
    </ol>
    <hr>
    <!--Ordered list with type(i) attribute/>property-->
     <ol type="i">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
        <li>BOOTSTRAP</li>
    </ol>
    <hr>
  </body>
</html>

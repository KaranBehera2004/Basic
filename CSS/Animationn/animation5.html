<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            animation-name: movingele;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            /* margin-top: 100px;
            margin-left: 100px; */
            /* border-radius: 50%; */
        }
        @keyframes movingele {
           0%
           {
              margin-left: 0px;
              margin-top: 0px;
           }
           25%
           {
                margin-left: 400px;
                margin-top: 0px;
           }
           50%
           {
                margin-left: 400px;
                margin-top: 200px;
           }
           100%
           {
                margin-left: 0px;
                margin-top: 200px;
           }
        }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>

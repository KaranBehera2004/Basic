<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        #parent
        {
            height: 50px;
            width: 600px;
            /* background-color: green; */
            margin-top: 100px;
            margin-left: 100px;
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
        }
        .child
        {
            height: 30px;
            width: 30px;
            background-color: blue;
            border-radius: 50%;
            animation-name: loading;
            /* animation-iteration-count: infinite; */
            animation-duration: 2s;
        }
        @keyframes loading {
            0%
            {
                margin-top: -50px;
            }
            50%
            {
                margin-top: 0px;
            }
            100%
            {
                margin-top: -50px;
            }
        }
        .child2
        {
            animation-delay: 2s;
        }
        .child3
        {
            animation-delay: 4s;
        }
    </style>
  </head>
  <body>
    <div id="parent">
        <div class="child child1"></div>
        <div class="child child2"></div>
        <div class="child child3"></div>
    </div>
  </body>
</html>

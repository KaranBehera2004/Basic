<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        div{
            height: 100px;
            width: 100%;
            background-color: black;
            position: absolute;
            left: 0px;
            right: 0px;
            overflow-x: hidden;
        }
        p{
            color: white;
            display: inline-block;
            padding-left: 98%;
            animation-name: scroll;
            animation-duration: 15s;
            animation-iteration-count: infinite;
            /* animation-timing-function: ease; */
        }
        @keyframes scroll {
            from
            {
                transform: translateX(0%);
            }
            to
            {
                transform: translateX(-100%);
            }
        }
    </style>
  </head>
  <body>
    <div>
        <p>para </p>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        img
        {
            margin-top: 300px;
            margin-left: 600px;
            animation-name: bounse;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes bounse {
            0%{
                margin-top: 0px;
            }
            25%
            {
                margin-top: 100px;
            }
            50%
            {
                margin-top: -100px;
            }
        }
    </style>
  </head>
  <body>
    <img height="100" width="100" src="https://cdn.pixabay.com/photo/2013/07/13/10/51/football-157930_1280.png" alt="">
  </body>
</html>

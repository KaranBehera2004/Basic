<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-color: blueviolet;
            animation-name: movingele;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            margin-top: 100px;
            margin-left: 100px;
            /* border-radius: 50%; */
        }
        @keyframes movingele {
           from
           {
                /* transform: scale(1); */
                border-radius: 0px;
           }
           to
           {
                /* transform: scale(1.5); */
                border-radius: 50%;
                background-color: red;
           }
        }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>

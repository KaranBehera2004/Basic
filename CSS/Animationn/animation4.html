<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        #outer{
            height: 30px;
            width: 800px;
            background-color: blueviolet;
            /* animation-name: progress;
            animation-duration: 2s;
            animation-iteration-count: infinite; */
            margin-top: 100px;
            margin-left: 100px;
            border-radius: 20px;
        }
        #inner
        {
            height: 30px;
            width: 400px;
            background-color: orange;
            border-radius: 20px;
            animation-name: progress;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        @keyframes progress {
            from{
                width: 0px;
            }
            to
            {
                width: 600px;
                background-color: aqua;
            }
        }
    </style>
  </head>
  <body>
   <div id="outer">
    <div id="inner"></div>
   </div>
  </body>
</html>

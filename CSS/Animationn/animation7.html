<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        img
        {
            animation-name: rotate;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes rotate {
            from
            {
                transform: rotate(0deg);
            }
            to
            {
                transform: rotate(360deg);
            }
        }
    </style>
  </head>
  <body>
    <img height="350" width="400" src="https://cdn.pixabay.com/photo/2017/07/10/13/49/wooden-wheel-2490210_1280.png" alt="">
    <img height="350" width="600" src="https://cdn.pixabay.com/photo/2022/09/09/13/45/steering-wheel-7443040_1280.png" alt="">
  </body>
</html>

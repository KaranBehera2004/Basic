<!DOCTYPE html>
<html lang="en">
  <body>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        div{border: 2px solid red;padding: 20px;}
        #div1{margin: 10px;}
        #div2{margin: 20px;}
        #div3{margin: 30px;}
        #div4{margin: 100px;}

        #div6{margin: 100px;}

  </head>
  <body>
    <h1>Margin property</h1>

    <div id="div2">Margin : 20px;</div>
    <div id="div3">Margin : 30px;</div>
    <div id="div4">Margin : 100px;</div>
    <div id="div5">Margin : 100px;</div>
    <div id="div6">Margin : 100px;</div>
    </div>
  </body>
</html>

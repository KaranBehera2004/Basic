<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
      div{
        height: 200px;
        width: 200px;
        background-color: blue;
        position: Fixed;
        bottom: 0px;
        left: 0px;
      }
    </style>
  </head>
  <body>
    <h1>Fixed Position</h1>
    <p>If we use fixed position , then the element is fixede in webpage (it will not move)</p>
    <p>It is calculated from the edges of the screen.</p>
    <p>Here we use top,left,bottom,right values.</p>
    <div></div>
  </body>
</html>

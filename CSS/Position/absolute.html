<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
      div{
        height: 200px;
        width: 200px;
        background-color: blue;
        position: absolute;
        bottom: 0px;
        right: 0px;
      }
    </style>
  </head>
  <body>
    <h1>Absolute Position</h1>
    <p>It is calculated from the edges of the screen.</p>
    <p>Here we use top,left,bottom,right values.</p>
    <p>The space of that element is not created it is occupied by next element.</p>
    <div></div>
  </body>
</html>

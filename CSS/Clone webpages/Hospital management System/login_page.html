<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        nav {
            height: 150px;
            width: 100%;
            border: 1px solid gray;
            display: flex;
            align-items: center;
            justify-content: space-between;
			/* background-color: rgb(190, 202, 210); */
        }
        nav>div>h1{
            font-size: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
        }

        #div1 {
            display: flex;
            /* justify-content: center; */
            align-items: center;
            gap: 50px;
            padding-left: 10px;
            /* background-color : white; */
        }

        #img1 {
            height: 130px;
            width: 130px;
        }

        .navbar {
            /* background: #007BFF; */
            padding: 15px;
            display: flex;
            /* justify-content: flex-end; */
            align-items: center;
            gap: 20px;
            height: 50px;
        }
        #div4
        {
            height: 700px;
            width: 100%;
            border: 5px solid red;
            display: flex;
            justify-content: center;
            background-image: url(https://i.pinimg.com/1200x/40/8e/33/408e331d8ec30475b0a33e2fb179ef64.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            /* transition: all 1s; */
        }
        #div5
        {
            height: 500px;
            width: 500px;
            border: 1px solid gray;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            /* justify-content: center; */
            align-items: center;
            gap: 50px;
            border-radius: 20px;
            padding-top: 30px;
            background-color: rgba(66, 192, 192, 0.63);
            box-shadow: 0px 0px 20px white;
            transition: all 1s;
        }
        #div5:hover
        {
            transform: scale(1.1);
            box-shadow: 0px 0px 10px orange;
        }
        form
        {
            display: flex;
            flex-direction: column;
            /* justify-content: center; */
            /* align-items: center; */
            gap: 10px;
        }
        #div5>h1
        {
            font-size: 50px;
        }
        form>label
        {
            font-size: 23px;
            margin-left: 10px;
            color: rgb(67, 66, 66);
        }
        form>input
        {
            height: 50px;
            width: 350px;
            border-radius: 30px;
            border: none;
            background-color: rgb(217, 219, 220);
            outline: 1px solid rgb(197, 195, 195);
            font-size: 20px;
            color: rgb(62, 60, 60);
            padding-left: 20px;
        }
        form>input:hover
        {
            box-shadow: 0px 0px 10px rgb(255, 208, 0);
        }
        form>button
        {
            margin-top: 20px;
            height: 50px;
            width: 350px;
            font-size: 23px;
            color: white;
            border-radius: 30px;
            border: none;
            outline: 1px solid rgb(181, 179, 179);
            background-color: rgb(17, 133, 223);
            /* opacity: 10px */
            ;
        }
        form>button:hover
        {
            background-color: rgb(72, 204, 234);
            outline:none;
            box-shadow: 0px 0px 10px greenyellow;
            color: aliceblue;
        }
        span
        {
            color: rgb(186, 47, 47);
        }
    </style>
  </head>
  <body>
    <nav>
        <div id="div1">
            <img id="img1" src="https://t3.ftcdn.net/jpg/05/14/36/48/360_F_514364850_xLOQX6SOY2qcjAIcTowsi3xYvHmhmvs0.jpg" alt="">
            <h1>Smart HealthCare</h1>
        </div>
        <div class="navbar">
        </div>
    </nav>

    <div id="div4">
        <div id="div5">
            <h1>Log In</h1>
            <form action="">
                <label>Enter UserName <span>*</span></label>
                <input type="text" name="admit_username">
                <label>Enter Password <span>*</span></label>
                <input type="password" name="admin_password">
                <button>Login</button>
            </form>
        </div>
    </div>
  </body>
</html>

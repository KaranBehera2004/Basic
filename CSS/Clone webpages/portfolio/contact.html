<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
   <title>Creative CV Website Template</title>
     <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJJWXp0pNU6VhP5xRpyylaQ6lwcxH_QHPRvCUYvXt1ndEjfCevLnBRDE9U9QlJDp7GdpY&usqp=CAU">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body{
          font-family: worksans-semibold,"work sans",sans-serif;
          background-color: rgb(245, 242, 242);
        }
        #div1
        {
          display: inline-block;
          height: 30px;
          width: 30px;
          background-color: orange;
          border-radius: 50%;
          margin-top: 20px;
        }
        span{
          display: inline-block;
          margin-left: 30px;
          margin-top: -100px;
        }
        a{
          display: inline-block;
          text-decoration: none;
        }
        #resume
        {
          margin-left: 900px;
        }
        #projects,#resume,#contact{
          padding: 10px
        }
        #projecth1
        {
            padding: 10px;
            margin-left: 100px;
        }
        img{
            height: 300px;
            width: 600px;
        }
        table{
            margin-left: 100px;
        }
        p{
            text-align: justify;
            line-height: 28px;
        }
        .th,.td{
            text-align: center;
            /* padding: 30px; */
            padding-left: 200px;
        }
        p{
            /* border: 1px solid red; */
            margin-top: -20px;
            font-size: 17px;
        }
        h1{
            font-size: 35px;
        }
        #container1
        {
            /* border: 2px solid green; */
            height: 300px;
            width: 300px;
            margin-left: 300px;
            margin-top: 100px;
        }
        /* .iln,.lln{
            margin-left: 200px;
        } */
        #container2
        {
            margin-left: 620px;
            margin-top: -350px;
            text-align: left;
            /* border: 2px solid red; */
        }
        input{
            height: 35px;
            width: 190px;
            background-color: transparent;
            border: 1px solid black;
        }
        th{}
        td{
            text-align: left;
        }
        .fname{
            margin-right: -200px;
        }
        textarea{
            height: 100px;
            width: 410px;
            background-color: transparent;
        }
        button{
            height: 50px;
            width: 408px;
            margin-left: 112px;
            border-radius: 30px;
            background-color: orange;
            font-size: 20px;
            font-weight: bold;
        }
        #name
        {
            color: black;
            font-weight: bold;
            font-size: 20px;
        }
        #footer
        {
            margin-left: 0;
        }
    </style>
  </head>
  <body>
     <div id="div1"></div>
        <a href="homepage.html" id="name">Karan Kumar</a> 
        <span>Editor</span>

        <a href="Resumesite.html" id="resume">Resume</a> |
        <a href="project.html" id="projects">Projects</a> |
        <a href="contact.html" id="Contact">Contact</a>
        <div id="container1">
            <h1>Contact</h1>
            <p>Looking forward to hearing from you</p>

            <h4>Phone</h4>
            <p>123-456-7890</p>

            <h4>Email</h4>
            <p>info@mysite.com</p>
        </div>

        <div id="container2">
            <form>
                <table cellpadding="10px">
                    <tbody>
                        <tr>
                            <td>
                                <label class="fname">First Name *</label> <br><br>
                                <input class="fname" type="text" name="fname">
                            </input>
                            <td>
                                <label class="lln">Last Name *</label><br><br>
                                <input class="iln" type="text" name="lname">
                            </td>
                        </br>
                        <tr>
                            <td>
                                <label class="email">Email *</label><br><br>
                                <input class="email" type="email" name="email">
                            </td>
                            <td>
                                <label>Subject *</label><br><br>
                                <input type="text" name="subject">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <label>Message</label><br><br>
                                <textarea></textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <button>Submit</button>
            </form>
        </div>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <hr>
         <table id="footer">
            <thead>
                <tr>
                    <th class="th">Phone</th>
                    <th class="th">Email</th>
                    <th class="th">Follow Me</th>
                    <th class="th"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                <td class="td">123-456-7890</td>
                <td class="td">info@gmail.com</td>
                <td class="td">in</td>
                <td class="td">© 2035 By Nicol Rider. <br> Powered and secured by Wix</td>
                </tr>
          </tbody>
        </table>
  </body>
</html>

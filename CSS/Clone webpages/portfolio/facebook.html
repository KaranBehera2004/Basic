<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Facebook-Log in or Sign in</title>
    <link rel="icon" href="https://i.pinimg.com/736x/1e/0f/37/1e0f37ff0a7161dbebf7550685b8b668.jpg">
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: sans-serif;
        }
        body{
            background-color: rgb(236, 234, 234);
        }
        h1{color: blue; font-size: 60px; padding: 10px;}
        #container1
        {
            /* border: 2px solid red; */
            width: 280px;
            margin-left: 400px;
            margin-top: 200px;
        }
        #container1>p{
            padding: 10px;
            font-size: 16px;
        }
        input
        {
            padding: 10px;
            width: 300px;
            border-radius: 3px;
            border-color: rgb(199, 192, 192);
        }
        
        #login{
            padding: 10px;
            width: 322px;
            font-weight: bold;
            font-size: 18px;
            background-color: rgb(47, 47, 214);
            color: white;
            border: none;
            border-radius: 5px;
        }
        #container1
        {
            margin-right: -100px;
        }
        #login:hover{
            background-color: rgb(87, 87, 236);
        }
        a{
            text-decoration: none;
            color: blue;
        }
        a:hover
        {
            text-decoration: underline;
        }
        #container2{
            /* border: 2px solid red; */
            width: 330px;
            height: 300px;
            text-align: center;
            padding: 40px;
            margin-left: 750px;
            margin-top: -200px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 25px black;
        }
        #cna{
            padding: 15px;
            background-color: rgb(20, 157, 20);
            border-radius: 3px;
            font-weight: bold;
            color: white;
            margin-top: 20px;
            border: none;
            width: 200px;
            font-size: 16px;
        }
        #cna:hover{
            background-color: rgb(3, 144, 3);
        }
        #para2
        {
            margin-left: 800px;
            margin-top: 30px;
        }
        span:hover
        {
            text-decoration: underline;
        }
    </style>
  </head>
  <body>
    <div id="container1">
        <h1>facebook</h1>
        <p>Connect with friends and the world <br> around you on facebook</p>
    </div>
    <div id="container2">
        <form action="">
            <input id="intext" type="text" name="email" placeholder="Username and phone number" autofocus> <br><br>
            <input type="password" name="password" placeholder="password"><br><br>
            <button id="login">Log in</button> <br><br>
        </form>
        <a href="">Forgot account?</a> <br><br>
        <hr>
        <button id="cna">Create New Account</button>
    </div>
    <p id="para2"><span><b>Create a page </b></span> for a celibrity, band or business.</p>
  </body>
</html>

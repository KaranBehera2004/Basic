  <head>
    <meta charset="utf-8">
    <title>title</title>

  <style>
    div h1{
      color: red;
    }
    span p{
      color: blue;
    }
  </style>
  <body>
    <h1>Descendent Selectors</h1>
    <p>it is used to target the direct and indirect  member of the specified tag</p>

      <h1>direct member of div</h1>
      <p>direct member of div</p>
      <span>
        <h1>indirect memeber of div, direct member of span</h1>
        <p>indirect member of div , direct memeber of span</p>
      </span>
    </div>
  </body>

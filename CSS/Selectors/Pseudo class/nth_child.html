<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        li:nth-child(even)
        {
            background-color: blueviolet;
        }
        li:nth-child(odd)
        {
            background-color: aqua;
        }
        li:nth-child(5)
        {
            background-color: red;
        }
    </style>
  </head>
  <body>
    <h1>nth child pseduoo class selector</h1>
    <p>it will target the specified element wherever it is the nth child</p>
    <ul>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
        <li>list items</li>
    </ul>
  </body>
</html>

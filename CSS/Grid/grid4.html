<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style-type: none;
            display: grid;
            grid-template-rows: repeat(3,1fr);
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
            height: 400px;
            width: 600px;
        }
        li{
            border: 2px solid red;
            border-radius: 10px;
            background-color: blueviolet;
            color: white;
        }
        .child1{
            grid-row: 1/3;
            grid-column: 1/2;
        }
        .child2{
            grid-row: 1/2;
            grid-column: 2/4;
        }
        .child3{
            grid-row: 3/4;
            grid-column: 1/2;
        }
        .child4{
            grid-row: 2/4;
            grid-column: 2/3;
        }
    </style>
</head>
<body>
    <ul>
        <li class="child1">child items1</li>
        <li class="child2">child items2</li>
        <li class="child3">child items3</li>
        <li class="child4">child items4</li>
        <li class="child5">child items5</li>
        <li class="child6">child items6</li>
    </ul>
</body>
</html>

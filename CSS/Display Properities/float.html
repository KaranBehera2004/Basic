<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        header{
            display: flex;
            justify-content: space-around;
            background-image: linear-gradient(red,blue,green);
            color: white;
        }
        p{
            font-size: 20px;
        }
        div{
            height: 500px;
            width: 300px;
            border: 2px solid red;
            display: float;
            float: right;
        }
        button
        {
            display: float;
            float: right;
        }
    </style>
  </head>
  <body>
    <header>
        <p>one</p>
        <p>two</p>
    </header>
    <div>
        <button>X</button>
    </div>
  </body>
</html>
